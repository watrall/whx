name: Update site photo galleries

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Fetch photos from Wikimedia Commons
        run: node scripts/build-gallery.mjs --refresh

      - name: Commit refreshed galleries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gallery.json data/photos.json
          if git diff --staged --quiet; then
            echo "No gallery changes."
          else
            git commit -m "Refresh site photo galleries"
            git push
          fi
